# Football Realm — request a Unity manual activation file (GameCI).
# This is step 1 of the GameCI Personal-licence flow: the runner
# generates a machine-specific .alf file and uploads it as an artifact.
# Step 2 (uploading the .alf at license.unity3d.com to get a .ulf)
# may not work for Personal licences under Unity's current rules
# (Personal activates via Hub sign-in only) — this workflow tests
# whether the .alf route still produces anything usable.
name: Acquire activation file

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.64f1
      - uses: actions/upload-artifact@v4
        with:
          name: ActivationFile
          path: "*.alf"
